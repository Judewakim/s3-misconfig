AWSTemplateFormatVersion: "2010-09-09"
Description: >
  S3 Sentry Client Onboarding — deploys a single cross-account IAM role that
  grants S3 Sentry read (audit) and limited write (remediation) access to S3.
  No Lambda, no EC2, no SQS. Zero logic in the client account.

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:
  ProviderAccountId:
    Type: String
    Default: "390488375643"
    Description: "S3 Sentry provider AWS account ID. Do not change this value."

  ExternalId:
    Type: String
    Description: "Unique security token provided by S3 Sentry during registration. Do not share."
    MinLength: 8
    NoEcho: true

  EnableRemediation:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      "true" lets S3 Sentry apply one-click fixes you approve by email.
      "false" deploys a strictly read-only role (scan and report only).

Conditions:
  RemediationEnabled: !Equals [!Ref EnableRemediation, "true"]

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:

  S3SentryCrossAccountRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: S3SentryCrossAccountRole
      Description: "Grants S3 Sentry read and remediation access to S3 in this account."

      # ----- Trust Policy -----
      # Two independent locks, both required:
      #   1. ExternalId  — unique per tenant; stops the Confused Deputy attack.
      #   2. PrincipalArn — only the two S3 Sentry Lambda roles may assume this
      #      role, not any other identity in the provider account.
      # PrincipalArn is used (instead of putting the role ARNs in Principal)
      # because IAM rewrites a role-ARN Principal to the role's internal ID.
      # If the provider stack is ever recreated, that ID changes and every
      # tenant's trust policy silently breaks. A condition on the ARN survives.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowS3SentryLambdasOnly
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${ProviderAccountId}:root"
            # SetSourceIdentity lets your CloudTrail show which person approved
            # each change S3 Sentry makes.
            Action: [sts:AssumeRole, sts:SetSourceIdentity]
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
              ArnEquals:
                aws:PrincipalArn:
                  - !Sub "arn:aws:iam::${ProviderAccountId}:role/S3SentryOrchestratorRole"
                  - !Sub "arn:aws:iam::${ProviderAccountId}:role/S3SentryResponderRole"

      Policies:
        # ----- Policy 1: Audit (Read-Only) -----
        # Required for Prowler 3.x S3 checks defined in orchestrator.py.
        # All communication is restricted to TLS via the SecureTransport condition.
        - PolicyName: S3SentryAuditPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: S3ReadAccess
                Effect: Allow
                Action:
                  - s3:ListAllMyBuckets
                  - s3:GetBucketAcl
                  - s3:GetBucketPolicy
                  - s3:GetBucketPolicyStatus
                  - s3:GetBucketPublicAccessBlock
                  - s3:GetBucketOwnershipControls
                  - s3:GetBucketTagging
                  - s3:GetEncryptionConfiguration
                  - s3:GetBucketVersioning
                  - s3:GetBucketObjectLockConfiguration
                  - s3:GetBucketLogging
                  - s3:GetBucketLocation
                  - s3:GetLifecycleConfiguration
                  - s3:GetBucketCORS
                  - s3:GetReplicationConfiguration
                Resource: "arn:aws:s3:::*"
                Condition:
                  Bool:
                    aws:SecureTransport: "true"

              # Account-level settings have no bucket ARN, so they need "*".
              - Sid: S3AccountLevelRead
                Effect: Allow
                Action:
                  - s3:ListAllMyBuckets
                  - s3:GetAccountPublicAccessBlock
                Resource: "*"
                Condition:
                  Bool:
                    aws:SecureTransport: "true"

              - Sid: CloudTrailReadAccess
                Effect: Allow
                Action:
                  - cloudtrail:ListTrails
                  - cloudtrail:DescribeTrails
                  - cloudtrail:GetEventSelectors
                Resource: "*"
                Condition:
                  Bool:
                    aws:SecureTransport: "true"

              - Sid: CloudWatchLogsReadAccess
                Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                Resource: "*"
                Condition:
                  Bool:
                    aws:SecureTransport: "true"

              - Sid: KMSReadAccess
                Effect: Allow
                Action:
                  - kms:DescribeKey
                  - kms:GetKeyRotationStatus
                  - kms:GetKeyPolicy
                Resource: "*"
                Condition:
                  Bool:
                    aws:SecureTransport: "true"

        # ----- Policy 2: Remediation (Limited Write) -----
        # Required for Phase 4 safety_engine.py one-click fixes.
        # Scoped to bucket-level S3 ARNs only — no object-level access.
        # Never includes DeleteBucket, DeleteObject, PutObject, or any IAM action.
        - !If
          - RemediationEnabled
          - PolicyName: S3SentryRemediationPolicy
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: S3WriteAccess
                  Effect: Allow
                  Action:
                    - s3:PutBucketPublicAccessBlock
                    - s3:PutBucketPolicy
                    - s3:PutEncryptionConfiguration
                    - s3:PutBucketVersioning
                    - s3:PutBucketAcl
                    - s3:PutBucketLogging
                  Resource: "arn:aws:s3:::*"
                  Condition:
                    Bool:
                      aws:SecureTransport: "true"

                - Sid: KMSWriteAccess
                  Effect: Allow
                  Action:
                    - kms:EnableKeyRotation
                  Resource: "*"
                  Condition:
                    Bool:
                      aws:SecureTransport: "true"
          - !Ref AWS::NoValue

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
# The customer copies these two values (the ExternalId is never echoed back,
# because it is NoEcho; S3 Sentry already holds it from registration) into the S3 Sentry onboarding form.
# The orchestrator stores them as:
#   PK = ACC#<AWSAccountId>
#   SK = METADATA
#   RoleArn = <RoleArn>
#   ExternalId = <ExternalId>
Outputs:
  RoleArn:
    Description: "S3 Sentry — paste this as your Role ARN"
    Value: !GetAtt S3SentryCrossAccountRole.Arn

  AWSAccountId:
    Description: "S3 Sentry — your AWS Account ID"
    Value: !Ref AWS::AccountId

