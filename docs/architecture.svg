<text x="1075.0" y="159" text-anchor="middle" font-size="12" fill="#5b6875">cross-account</text>
<text x="1075.0" y="177" text-anchor="middle" font-size="12" fill="#5b6875">only thing deployed</text>
<rect x="1000" y="260" width="150" height="62" rx="5" fill="#fff" stroke="#18222e" stroke-width="1.5"/>
<text x="1075.0" y="287" text-anchor="middle" font-size="14" font-weight="700" fill="#18222e">S3 buckets</text>
<text x="1075.0" y="307" text-anchor="middle" font-size="12" fill="#5b6875">14 checks</text>
