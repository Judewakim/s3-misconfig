<rect x="280" y="110" width="180" height="62" rx="5" fill="#fff" stroke="#18222e" stroke-width="1.5"/>
<text x="370.0" y="137" text-anchor="middle" font-size="14" font-weight="700" fill="#18222e">Orchestrator Lambda</text>
<text x="370.0" y="157" text-anchor="middle" font-size="12" fill="#5b6875">container image + Prowler</text>
<rect x="520" y="110" width="180" height="62" rx="5" fill="#fff" stroke="#18222e" stroke-width="1.5"/>
<text x="610.0" y="137" text-anchor="middle" font-size="14" font-weight="700" fill="#18222e">SES</text>
<text x="610.0" y="157" text-anchor="middle" font-size="12" fill="#5b6875">scan email, signed links</text>
<rect x="760" y="110" width="180" height="62" rx="5" fill="#fff" stroke="#18222e" stroke-width="1.5"/>
<text x="850.0" y="137" text-anchor="middle" font-size="14" font-weight="700" fill="#18222e">Bucket owner</text>
<text x="850.0" y="157" text-anchor="middle" font-size="12" fill="#5b6875">Fix / Ignore links</text>
<rect x="40" y="240" width="180" height="62" rx="5" fill="#fff" stroke="#18222e" stroke-width="1.5"/>
<text x="130.0" y="267" text-anchor="middle" font-size="14" font-weight="700" fill="#18222e">SSM Parameter Store</text>
<text x="130.0" y="287" text-anchor="middle" font-size="12" fill="#5b6875">HMAC signing key</text>
<rect x="280" y="240" width="180" height="62" rx="5" fill="#fff" stroke="#18222e" stroke-width="1.5"/>
<text x="370.0" y="267" text-anchor="middle" font-size="14" font-weight="700" fill="#18222e">DynamoDB</text>
<text x="370.0" y="287" text-anchor="middle" font-size="12" fill="#5b6875">tenants, findings, audit log</text>
<rect x="520" y="240" width="180" height="62" rx="5" fill="#fff" stroke="#18222e" stroke-width="1.5"/>
<text x="610.0" y="267" text-anchor="middle" font-size="14" font-weight="700" fill="#18222e">S3 vault</text>
<text x="610.0" y="287" text-anchor="middle" font-size="12" fill="#5b6875">pre-fix config snapshots</text>
<rect x="760" y="240" width="180" height="62" rx="5" fill="#fff" stroke="#18222e" stroke-width="1.5"/>
<text x="850.0" y="267" text-anchor="middle" font-size="14" font-weight="700" fill="#18222e">Responder Lambda</text>
<text x="850.0" y="287" text-anchor="middle" font-size="12" fill="#5b6875">verify link, snapshot, fix</text>
