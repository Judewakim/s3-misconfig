<text x="1075.0" y="529" text-anchor="middle" font-size="14" font-weight="700" fill="#18222e">CloudFormation</text>
<text x="1075.0" y="549" text-anchor="middle" font-size="12" fill="#5b6875">quick-create stack</text>
<rect x="1000" y="600" width="150" height="80" rx="5" fill="#fff" stroke="#1e6b52" stroke-width="1.5"/>
<text x="1075.0" y="627" text-anchor="middle" font-size="14" font-weight="700" fill="#18222e">Read-only role</text>
<text x="1075.0" y="647" text-anchor="middle" font-size="12" fill="#5b6875">bucket settings only</text>
<text x="1075.0" y="665" text-anchor="middle" font-size="12" fill="#5b6875">deleted after</text>
<polyline points="1075,564 1075,600" fill="none" stroke="#18222e" stroke-width="1.5" marker-end="url(#a)"/>
<polyline points="130,520 130,498 985,498 985,533 1000,533" fill="none" stroke="#18222e" stroke-width="1.5" marker-end="url(#a)"/>
<text x="560" y="492" text-anchor="middle" font-size="11.5" fill="#5b6875">2 quick-create stack</text>
<polyline points="700,551 978,551 978,630 1000,630" fill="none" stroke="#1e6b52" stroke-width="1.5" marker-end="url(#g)"/>
<text x="830" y="543" text-anchor="middle" font-size="11.5" fill="#1e6b52">AssumeRole · one-time ExternalId</text>
<text x="716" y="612" font-size="13" fill="#5b6875">Steps: 1 session · 2 stack · 3 scan · 4 poll</text>
<text x="716" y="648" font-size="13" fill="#5b6875">Abuse and cost caps:</text>
<text x="716" y="670" font-size="12.5" fill="#18222e">256-bit hashed session ID</text>
<text x="716" y="690" font-size="12.5" fill="#18222e">per-IP and global daily limits</text>
<text x="716" y="710" font-size="12.5" fill="#18222e">one scan per session, no retries</text>
