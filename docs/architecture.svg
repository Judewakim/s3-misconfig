<polyline points="460,141 520,141" fill="none" stroke="#18222e" stroke-width="1.5" marker-end="url(#a)"/>
<polyline points="700,141 760,141" fill="none" stroke="#18222e" stroke-width="1.5" marker-end="url(#a)"/>
<polyline points="370,172 370,240" fill="none" stroke="#18222e" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
