<text x="620" y="86" text-anchor="middle" font-size="11.5" fill="#1e6b52">sts:AssumeRole · per-tenant ExternalId + PrincipalArn condition</text>
<polyline points="940,262 1000,176" fill="none" stroke="#1e6b52" stroke-width="1.5" marker-end="url(#g)"/>
<text x="872" y="200" text-anchor="start" font-size="11.5" fill="#1e6b52">AssumeRole</text>
<text x="872" y="215" text-anchor="start" font-size="11.5" fill="#1e6b52">to apply fix</text>
<rect x="20" y="410" width="1160" height="350" fill="#e9eef2" rx="6"/>
<text x="40" y="440" font-size="18" font-weight="700" fill="#18222e">Public live demo  (isolated stack)</text>
<text x="40" y="460" font-size="13" fill="#5b6875">A visitor scans their own account through a one-time read-only role. No email, no schedule, separate table and roles.</text>
<rect x="40" y="520" width="180" height="62" rx="5" fill="#fff" stroke="#18222e" stroke-width="1.5"/>
<text x="130.0" y="547" text-anchor="middle" font-size="14" font-weight="700" fill="#18222e">Visitor&#x27;s browser</text>
<text x="130.0" y="567" text-anchor="middle" font-size="12" fill="#5b6875">static demo page</text>
<rect x="280" y="520" width="180" height="62" rx="5" fill="#fff" stroke="#18222e" stroke-width="1.5"/>
<text x="370.0" y="547" text-anchor="middle" font-size="14" font-weight="700" fill="#18222e">Demo API Lambda</text>
<text x="370.0" y="567" text-anchor="middle" font-size="12" fill="#5b6875">Function URL, rate-limited</text>
<rect x="520" y="520" width="180" height="62" rx="5" fill="#fff" stroke="#18222e" stroke-width="1.5"/>
<text x="610.0" y="547" text-anchor="middle" font-size="14" font-weight="700" fill="#18222e">Demo scanner Lambda</text>
<text x="610.0" y="567" text-anchor="middle" font-size="12" fill="#5b6875">same Prowler engine</text>
<rect x="40" y="650" width="180" height="62" rx="5" fill="#fff" stroke="#18222e" stroke-width="1.5"/>
<text x="130.0" y="677" text-anchor="middle" font-size="14" font-weight="700" fill="#18222e">Template bucket</text>
<text x="130.0" y="697" text-anchor="middle" font-size="12" fill="#5b6875">private, presigned GET 1 h</text>
<rect x="280" y="650" width="180" height="62" rx="5" fill="#fff" stroke="#18222e" stroke-width="1.5"/>
<text x="370.0" y="677" text-anchor="middle" font-size="14" font-weight="700" fill="#18222e">DynamoDB</text>
<text x="370.0" y="697" text-anchor="middle" font-size="12" fill="#5b6875">sessions, 24 h TTL</text>
