<text x="40" y="50" font-size="18" font-weight="700" fill="#18222e">Scheduled scan and one-click fix  (provider account)</text>
<text x="40" y="70" font-size="13" fill="#5b6875">Daily scan of every onboarded account; the bucket owner fixes findings from a signed email link</text>
