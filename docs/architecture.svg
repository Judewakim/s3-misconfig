<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="Archivo, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">S3 Sentry architecture</title>
<desc id="d">Scheduled scanning and signed one-click fixes from a provider account into customer accounts, plus an isolated public demo that scans a visitor&#x27;s own account through a one-time read-only role.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#18222e"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1e6b52"/></marker></defs>
<rect width="1200" height="780" fill="#ffffff"/>
