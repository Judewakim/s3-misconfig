<text x="610" y="368" text-anchor="middle" font-size="11.5" fill="#5b6875">Responder reads the key, checks the single-use nonce, writes the audit record</text>
<rect x="990" y="80" width="170" height="290" rx="6" fill="#fff" stroke="#1e6b52" stroke-width="2" stroke-dasharray="6 4"/>
